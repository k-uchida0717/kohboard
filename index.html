<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KOH Trip Vlog Location Board</title>
<meta name="description" content="旅Vlogの撮影場所・ショット・持ち物をボードにまとめて、当日はスマホでチェックしながら撮影できるアプリ。オフライン対応。">
<meta name="theme-color" content="#2A2824">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="KOH Trip Vlog">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   KOHboard — カラーは「試写室・撮影現場の道具箱」トーン
   ========================================================================= */
:root{
  --canvas:#21201D;      /* 暖かみのある黒（試写室） */
  --canvas-2:#2A2824;    /* 一段明るい黒（パネル） */
  --paper:#F7F5F0;       /* 紙焼き写真の白（カード面） */
  --paper-edge:#EDEAE2;  /* カード端 */
  --amber:#E3A857;       /* タングステン照明の琥珀（強調・ボタン） */
  --amber-dk:#C98F3E;
  --green:#3E6E64;       /* セーフライトの深緑（選択・リンク） */
  --green-lt:#5A9184;
  --ink:#1C1B1A;         /* 本文 */
  --ink-soft:#54514B;    /* 補助テキスト */
  --rule:#C9C3B8;        /* 罫線 */
  --chalk:#EDE9DF;       /* 暗背景上の文字（チョーク） */
  --chalk-dim:#9C978B;
  --danger:#B4553F;
  --shadow: 0 1px 0 rgba(0,0,0,.04), 0 6px 14px rgba(0,0,0,.28);
  --font-slab:"Zilla Slab", Georgia, "Yu Mincho", serif;
  --font-sans:"IBM Plex Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--font-sans);
  color:var(--chalk);
  background:
    radial-gradient(1200px 700px at 70% -10%, #2B2925 0%, rgba(43,41,37,0) 60%),
    var(--canvas);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--amber);color:var(--ink)}

/* ---- 上部バー / パンくず ---- */
#topbar{
  flex:0 0 auto;min-height:52px;padding-top:env(safe-area-inset-top,0px); display:flex; align-items:center; gap:14px;
  padding:0 14px; background:var(--canvas-2);
  border-bottom:1px solid #000;
  box-shadow:0 2px 0 rgba(0,0,0,.25);
  position:relative; z-index:30;
}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-slab);font-weight:700;font-size:18px;letter-spacing:.5px;color:var(--chalk)}
.brand .clap{width:24px;height:24px;flex:0 0 auto}
.brand .bname{display:flex;flex-direction:column;line-height:1.05}
.brand small{font-family:var(--font-mono);font-size:10px;color:var(--chalk-dim);letter-spacing:2px;font-weight:500;transform:translateY(1px)}

.crumb{display:flex;align-items:center;gap:6px;font-size:14px;min-width:0;flex:1}
.crumb .sep{color:var(--chalk-dim);font-family:var(--font-mono)}
.crumb-btn{
  background:transparent;border:1px solid transparent;color:var(--chalk-dim);
  padding:5px 9px;border-radius:6px;font-size:14px;max-width:34vw;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.crumb-btn:hover{color:var(--chalk);background:#00000030}
.crumb-btn.active{color:var(--chalk);font-weight:600}
.crumb-btn.pick::after{content:" ▾";color:var(--chalk-dim);font-size:11px}

.top-actions{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.tbtn{
  background:#00000025;border:1px solid #00000040;color:var(--chalk-dim);
  padding:7px 11px;border-radius:6px;font-size:12.5px;display:flex;align-items:center;gap:6px;
}
.tbtn:hover{color:var(--chalk);border-color:var(--amber);background:#00000045}
.tbtn.primary{background:var(--amber);color:#2a2113;border-color:var(--amber-dk);font-weight:600}
.tbtn.primary:hover{background:var(--amber-dk);color:#241b0d}

/* ---- 本体 ---- */
#stage{flex:1;min-height:0;display:flex}

/* 左ツールバー（フィルムストリップ風） */
#toolbar{
  width:78px;flex:0 0 78px;background:var(--canvas-2);
  border-right:1px solid #000;display:flex;flex-direction:column;align-items:center;
  padding:14px 0;gap:6px;position:relative;
}
/* スプロケットホール（フィルムの穴） */
#toolbar::before,#toolbar::after{
  content:"";position:absolute;top:0;bottom:0;width:9px;
  background-image:radial-gradient(circle at center, #000 0 2.6px, transparent 3px);
  background-size:9px 18px;background-repeat:repeat-y;opacity:.5;
}
#toolbar::before{left:3px}
#toolbar::after{right:3px}
.tool{
  width:56px;height:56px;border-radius:8px;background:#00000022;border:1px solid #00000030;
  color:var(--chalk-dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:9.5px;letter-spacing:.3px;position:relative;z-index:1;
}
.tool svg{width:20px;height:20px}
.tool:hover{color:var(--ink);background:var(--amber);border-color:var(--amber-dk)}
.tool:hover svg{stroke:var(--ink)}
.tool.wide{font-size:9px}
.tool-div{width:40px;height:1px;background:#00000040;margin:6px 0}
.tool-hint{margin-top:auto;font-family:var(--font-mono);font-size:8px;color:var(--chalk-dim);text-align:center;line-height:1.4;z-index:1;padding:0 4px}

/* メイン領域 */
#main{flex:1;min-width:0;position:relative;overflow:hidden}

/* ===== 今日のショット サマリーバー ===== */
#summary{
  position:absolute;top:0;left:0;right:0;height:46px;z-index:20;
  background:#141311;border-bottom:1px solid #000;display:flex;align-items:center;gap:14px;
  padding:0 16px;overflow-x:auto;box-shadow:0 2px 0 rgba(0,0,0,.2);
}
#summary::-webkit-scrollbar{display:none}
.sm-title{font-family:var(--font-slab);font-weight:600;font-size:13px;color:var(--chalk);flex:0 0 auto;display:flex;align-items:center;gap:7px}
.sm-title .rec{width:9px;height:9px;border-radius:50%;background:var(--danger);box-shadow:0 0 6px var(--danger);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.sm-main{font-family:var(--font-mono);font-size:12.5px;color:var(--chalk-dim);flex:0 0 auto;white-space:nowrap}
.sm-main b{color:var(--amber);font-size:16px}
.sm-main .done-n{color:var(--green-lt)}
.sm-bar{flex:0 0 130px;height:6px;background:#00000055;border-radius:6px;overflow:hidden}
.sm-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green-lt));width:0;transition:width .25s}
.sm-bar.full>i{background:linear-gradient(90deg,var(--amber-dk),var(--amber))}
.sm-chips{display:flex;gap:8px;flex:0 0 auto;margin-left:auto}
.sm-chip{font-family:var(--font-mono);font-size:11px;color:var(--chalk-dim);white-space:nowrap;display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:12px;background:#00000030;border:1px solid transparent}
.sm-chip .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.sm-chip.todo   .dot{background:var(--amber)}
.sm-chip.done   .dot{background:var(--green-lt)}
.sm-chip.retake .dot{background:var(--danger)}
.sm-chip.on{border-color:currentColor}
.sm-chip.todo.on{color:var(--amber)}
.sm-chip.done.on{color:var(--green-lt)}
.sm-chip.retake.on{color:var(--danger)}
.sm-chip:hover{color:var(--chalk)}
.sm-clear{font-family:var(--font-mono);font-size:10px;color:var(--chalk-dim);background:none;border:1px solid #ffffff22;padding:4px 8px;border-radius:12px;flex:0 0 auto}
.sm-clear:hover{color:var(--amber);border-color:var(--amber)}

/* ===== ボードキャンバス ===== */
#board{
  position:absolute;inset:46px 0 0 0;overflow-x:auto;overflow-y:hidden;
  display:flex;align-items:flex-start;gap:16px;padding:18px 18px 26px;
}
/* ラベルでフィルタ中に非該当カードを淡く */
#board.filtering .card{opacity:.22;filter:grayscale(.6)}
#board.filtering .card.match{opacity:1;filter:none}
#board::-webkit-scrollbar{height:12px}
#board::-webkit-scrollbar-thumb{background:#00000055;border-radius:8px;border:3px solid transparent;background-clip:padding-box}

.column{
  flex:0 0 288px;width:288px;max-height:100%;
  background:#1A1916;border:1px solid #000;border-radius:10px;
  display:flex;flex-direction:column;box-shadow:0 8px 20px rgba(0,0,0,.3);
}
.column.active{outline:2px solid var(--amber);outline-offset:1px}
/* カラムヘッダー = カチンコのスレート */
.col-head{
  position:relative;padding:10px 8px 9px;border-radius:10px 10px 0 0;
  background:#141311;border-bottom:1px solid #000;display:flex;align-items:center;gap:7px;
}
.col-head::before{ /* クラッパーの縞 */
  content:"";position:absolute;top:0;left:0;right:0;height:6px;border-radius:10px 10px 0 0;
  background:repeating-linear-gradient(115deg,#EDE9DF 0 12px,#1A1916 12px 24px);
  opacity:.85;
}
.col-grip{cursor:grab;color:var(--chalk-dim);font-size:13px;line-height:1;padding:2px;touch-action:none;user-select:none}
.col-grip:active{cursor:grabbing}
.col-scene{
  font-family:var(--font-mono);font-size:10px;font-weight:600;color:#241b0d;background:var(--amber);
  padding:2px 6px;border-radius:4px;letter-spacing:.5px;flex:0 0 auto;
}
.col-title{
  flex:1;min-width:0;font-family:var(--font-slab);font-weight:600;font-size:15px;color:var(--chalk);
  outline:none;padding:2px 3px;border-radius:4px;overflow-wrap:anywhere;
}
.col-title:focus{background:#ffffff12}
.col-title:empty::before{content:"カラム名";color:var(--chalk-dim)}
.col-count{font-family:var(--font-mono);font-size:10px;color:var(--chalk-dim);flex:0 0 auto}
.col-del{background:none;border:none;color:var(--chalk-dim);font-size:16px;line-height:1;padding:2px 5px;border-radius:4px;flex:0 0 auto}
.col-del:hover{color:#fff;background:var(--danger)}

.col-cards{
  flex:1;overflow-y:auto;overflow-x:hidden;padding:10px;display:flex;flex-direction:column;gap:11px;min-height:44px;
}
.col-cards::-webkit-scrollbar{width:9px}
.col-cards::-webkit-scrollbar-thumb{background:#00000050;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.col-empty{color:var(--chalk-dim);font-size:12px;text-align:center;padding:14px 6px;border:1px dashed #ffffff20;border-radius:8px;font-family:var(--font-mono)}

.col-add{
  margin:0 10px 10px;padding:9px;border-radius:7px;border:1px dashed #ffffff25;
  color:var(--chalk-dim);font-size:12.5px;text-align:center;background:transparent;
}
.col-add:hover{color:var(--amber);border-color:var(--amber)}

.add-col-inline{
  flex:0 0 168px;height:46px;align-self:flex-start;margin-top:2px;
  background:#00000020;border:1px dashed #ffffff25;border-radius:10px;color:var(--chalk-dim);font-size:13px;
}
.add-col-inline:hover{color:var(--amber);border-color:var(--amber)}

/* ===== カード（紙焼きメモ） ===== */
.card{
  position:relative;background:var(--paper);color:var(--ink);
  border:1px solid var(--paper-edge);border-bottom-color:var(--rule);
  border-radius:5px;box-shadow:var(--shadow);
  padding:9px 10px 10px;font-size:13.5px;line-height:1.5;
}
.card::after{ /* テープ跡風の微かな上辺 */
  content:"";position:absolute;left:12px;right:12px;top:-3px;height:3px;border-radius:2px;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.06),transparent);
}
.card-grip{
  position:absolute;top:4px;left:4px;color:#0000002e;font-size:11px;cursor:grab;
  padding:3px 4px;line-height:1;touch-action:none;user-select:none;border-radius:4px;
}
.card:hover .card-grip{color:#00000055}
.card-grip:active{cursor:grabbing}
.card-del{
  position:absolute;top:3px;right:3px;background:none;border:none;color:#00000030;font-size:15px;line-height:1;
  padding:2px 5px;border-radius:4px;opacity:0;
}
.card:hover .card-del{opacity:1}
.card-del:hover{color:#fff;background:var(--danger)}
/* カラーラベル（撮影ステータス） */
.card.lab-todo  {border-left:4px solid var(--amber)}
.card.lab-done  {border-left:4px solid var(--green-lt)}
.card.lab-retake{border-left:4px solid var(--danger)}
.card.lab-done .card-body,.card.lab-done .note-body{opacity:.92}
.card-lab{
  position:absolute;top:5px;right:24px;width:14px;height:14px;border-radius:50%;
  border:1.5px solid #00000030;background:transparent;padding:0;opacity:0;
}
.card:hover .card-lab{opacity:1}
.card.lab-todo .card-lab,.card.lab-done .card-lab,.card.lab-retake .card-lab{opacity:1;border:none}
.card.lab-todo   .card-lab{background:var(--amber)}
.card.lab-done   .card-lab{background:var(--green-lt)}
.card.lab-retake .card-lab{background:var(--danger)}
.card-lab:hover{border-color:var(--amber)}
.card-tag{
  display:inline-block;font-family:var(--font-mono);font-size:9px;font-weight:600;letter-spacing:.6px;
  text-transform:uppercase;padding:1px 5px;border-radius:3px;margin:2px 0 6px 12px;
}
.card-note   .card-tag{background:#EAE4D6;color:#6a5f45}
.card-check  .card-tag{background:#DDE9E4;color:#31564d}
.card-image  .card-tag{background:#E6E1D6;color:#6a5f45}
.card-link   .card-tag{background:#DDE9E4;color:#31564d}

.editable{outline:none;border-radius:3px;overflow-wrap:anywhere;white-space:pre-wrap}
.editable:focus{background:#00000008;box-shadow:inset 0 0 0 1px var(--rule)}
.editable.ph:empty::before{content:attr(data-ph);color:#00000040}

/* note */
.card-note .note-body{min-height:20px}

/* checklist */
.card-check .chk-title{font-weight:600;font-size:13px;margin-bottom:2px}
.chk-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.chk-progress{
  font-family:var(--font-mono);font-size:10px;font-weight:600;color:#31564d;background:#DDE9E4;
  padding:1px 6px;border-radius:10px;flex:0 0 auto;
}
.chk-progress.full{background:var(--green);color:#eaf3f0}
.chk-bar{height:3px;background:#00000012;border-radius:3px;overflow:hidden;margin:0 0 8px}
.chk-bar>i{display:block;height:100%;background:var(--green);width:0}
.chk-item{display:flex;align-items:flex-start;gap:7px;padding:2px 0}
.chk-box{
  width:15px;height:15px;flex:0 0 auto;margin-top:2px;border:1.5px solid var(--green);border-radius:4px;
  background:#fff;position:relative;cursor:pointer;
}
.chk-item.done .chk-box{background:var(--green)}
.chk-item.done .chk-box::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.chk-text{flex:1;font-size:13px}
.chk-item.done .chk-text{text-decoration:line-through;color:#00000055}
.chk-del{background:none;border:none;color:#00000028;font-size:14px;line-height:1;padding:0 3px;opacity:0}
.chk-item:hover .chk-del{opacity:1}
.chk-del:hover{color:var(--danger)}
.chk-add{background:none;border:none;color:var(--green);font-size:12px;padding:5px 2px 0;font-family:var(--font-mono)}
.chk-add:hover{color:var(--green-lt)}

/* image */
.card-image .img-wrap{background:#fff;padding:5px;border:1px solid var(--paper-edge);border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.card-image img{display:block;width:100%;border-radius:2px}
.card-image .img-empty{
  aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:#00000045;font-size:12px;border:1px dashed var(--rule);border-radius:3px;cursor:pointer;text-align:center;
}
.card-image .cap{margin-top:6px;font-size:12px;color:var(--ink-soft);font-family:var(--font-mono)}

/* link */
.card-link a.link-title{color:var(--green);font-weight:600;text-decoration:none;font-size:13.5px;display:block;word-break:break-all}
.card-link a.link-title:hover{text-decoration:underline;color:var(--green-lt)}
.card-link .link-thumb{width:100%;border-radius:3px;margin-bottom:7px;border:1px solid var(--paper-edge)}
.card-link .link-url{font-family:var(--font-mono);font-size:10px;color:#00000045;word-break:break-all;margin-top:2px}
.card-link .link-desc{font-size:12px;color:var(--ink-soft);margin-top:3px}
.card-link .link-fields{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.card-link .link-fields input{
  font-family:var(--font-mono);font-size:11px;padding:5px 7px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink);
}
.card-link .link-fields input:focus{outline:none;border-color:var(--green)}
.mini-btn{background:#EAE4D6;border:1px solid var(--rule);color:var(--ink-soft);font-size:11px;padding:4px 8px;border-radius:5px}
.mini-btn:hover{background:var(--amber);color:var(--ink);border-color:var(--amber-dk)}
.link-editrow{display:flex;gap:6px;margin-top:7px}

/* ===== ギャラリー（Home / Project） ===== */
#gallery{position:absolute;inset:0;overflow:auto;padding:30px 34px 60px}
.g-head{max-width:1000px;margin:0 auto 22px}
.g-title{font-family:var(--font-slab);font-weight:700;font-size:26px;color:var(--chalk);margin:0 0 4px}
.g-sub{color:var(--chalk-dim);font-size:13px;font-family:var(--font-mono)}
.g-grid{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:18px}
.g-card{
  background:var(--canvas-2);border:1px solid #000;border-radius:10px;padding:0;overflow:hidden;
  box-shadow:0 6px 16px rgba(0,0,0,.28);cursor:pointer;position:relative;transition:transform .08s;
}
.g-card:hover{transform:translateY(-2px);border-color:var(--amber)}
.g-card .g-strip{height:8px;background:repeating-linear-gradient(115deg,#EDE9DF 0 14px,#1A1916 14px 28px);opacity:.85}
.g-card .g-body{padding:15px 16px 16px}
.g-card h3{font-family:var(--font-slab);font-weight:600;font-size:17px;margin:0 0 8px;color:var(--chalk);word-break:break-word}
.g-card .g-meta{font-family:var(--font-mono);font-size:11px;color:var(--chalk-dim);display:flex;gap:12px}
.g-card .g-tools{position:absolute;top:14px;right:12px;display:flex;gap:4px;opacity:0}
.g-card:hover .g-tools{opacity:1}
.g-card .g-tools button{background:#00000055;border:none;color:var(--chalk-dim);font-size:13px;width:26px;height:26px;border-radius:6px}
.g-card .g-tools button:hover{color:#fff;background:var(--danger)}
.g-card .g-tools button.edit:hover{background:var(--green)}
.g-new{
  border:1.5px dashed #ffffff2a;background:#00000018;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;color:var(--chalk-dim);min-height:132px;cursor:pointer;
}
.g-new:hover{color:var(--amber);border-color:var(--amber)}
.g-new svg{width:26px;height:26px}

/* ===== ポップオーバー / メニュー ===== */
#pop{
  position:fixed;z-index:60;background:var(--canvas-2);border:1px solid #000;border-radius:9px;
  box-shadow:0 12px 30px rgba(0,0,0,.5);padding:6px;min-width:172px;display:none;
}
#pop button{
  display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;color:var(--chalk);
  padding:8px 10px;border-radius:6px;font-size:13px;text-align:left;
}
#pop button:hover{background:var(--amber);color:var(--ink)}
#pop button svg{width:16px;height:16px;flex:0 0 auto}
#pop .pop-lbl{font-family:var(--font-mono);font-size:9px;color:var(--chalk-dim);padding:5px 10px 3px;letter-spacing:1px}

/* ===== テンプレート選択オーバーレイ ===== */
#overlay{position:fixed;inset:0;z-index:80;background:rgba(10,9,8,.72);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;padding:20px}
#overlay.show{display:flex}
.ov-panel{background:var(--canvas-2);border:1px solid #000;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.6);max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:22px 24px 24px}
.ov-panel h2{font-family:var(--font-slab);font-weight:700;font-size:20px;margin:0 0 3px;color:var(--chalk)}
.ov-panel .ov-sub{color:var(--chalk-dim);font-size:12.5px;font-family:var(--font-mono);margin-bottom:16px}
.ov-field{display:flex;gap:8px;margin-bottom:16px}
.ov-field input{flex:1;background:#141311;border:1px solid #000;color:var(--chalk);border-radius:8px;padding:10px 12px;font-size:14px;font-family:var(--font-sans)}
.ov-field input:focus{outline:none;border-color:var(--amber)}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tpl{background:#141311;border:1px solid #000;border-radius:10px;padding:14px;cursor:pointer;position:relative;transition:transform .07s}
.tpl:hover{border-color:var(--amber);transform:translateY(-2px)}
.tpl.sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.tpl .tpl-tag{position:absolute;top:10px;right:10px;font-family:var(--font-mono);font-size:8px;letter-spacing:1px;color:#241b0d;background:var(--amber);padding:1px 5px;border-radius:3px}
.tpl h4{font-family:var(--font-slab);font-weight:600;font-size:14.5px;margin:0 0 6px;color:var(--chalk);padding-right:44px}
.tpl p{margin:0;font-size:11.5px;color:var(--chalk-dim);line-height:1.5}
.ov-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.ov-actions button{padding:9px 18px;border-radius:8px;font-size:13px;border:1px solid #00000040}
.ov-cancel{background:#00000025;color:var(--chalk-dim)}
.ov-cancel:hover{color:var(--chalk)}
.ov-ok{background:var(--amber);color:#2a2113;border-color:var(--amber-dk);font-weight:600}
.ov-ok:hover{background:var(--amber-dk)}

/* ドラッグ中 */
.drag-clone{position:fixed;z-index:9999;pointer-events:none;opacity:.94;transform:rotate(-1.5deg);box-shadow:0 18px 40px rgba(0,0,0,.55)}
.card-ph{border:2px dashed var(--amber);border-radius:5px;background:#e3a85718}
.col-ph{flex:0 0 288px;width:288px;border:2px dashed var(--amber);border-radius:10px;background:#e3a85714}
body.dragging{cursor:grabbing !important;user-select:none}

/* トースト */
#toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:#141311;color:var(--chalk);border:1px solid #000;border-left:3px solid var(--amber);
  padding:11px 16px;border-radius:7px;font-size:13px;box-shadow:0 10px 24px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:.22s;z-index:200;max-width:80vw;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* モバイル */
@media (max-width:640px){
  #toolbar{width:58px;flex-basis:58px}
  .tool{width:44px;height:44px;font-size:8px}
  .tool svg{width:17px;height:17px}
  .brand small{display:none}
  .crumb-btn{max-width:26vw}
  #gallery{padding:20px 16px 50px}
}

/* ===== 使い方ガイド ===== */
#help{position:fixed;inset:0;z-index:90;background:rgba(10,9,8,.8);display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#help.show{display:block}
.help-panel{background:var(--canvas-2);border:1px solid #000;border-radius:14px;max-width:760px;margin:0 auto;box-shadow:0 24px 60px rgba(0,0,0,.6);color:var(--chalk)}
.help-head{padding:20px 22px 14px;border-bottom:1px solid #000;position:relative}
.help-head h2{font-family:var(--font-slab);font-weight:700;font-size:21px;margin:0 0 4px;padding-right:44px;text-wrap:balance}
.help-head p{margin:0;color:var(--chalk-dim);font-size:13px;line-height:1.6}
.help-x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:8px;border:1px solid #00000040;background:#00000030;color:var(--chalk-dim);font-size:18px;line-height:1}
.help-x:hover,.help-x:focus-visible{color:var(--chalk);border-color:var(--amber);outline:none}
.help-toc{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.help-toc button{font-size:12px;padding:6px 11px;border-radius:14px;background:#00000040;color:var(--chalk-dim);border:1px solid transparent}
.help-toc button:hover,.help-toc button:focus-visible{color:var(--amber);border-color:var(--amber);outline:none}
.help-body{padding:4px 22px 8px}
.help-sec{padding:18px 0;border-bottom:1px dashed #ffffff1c;scroll-margin-top:12px}
.help-sec:last-child{border-bottom:none}
.help-sec h3{font-family:var(--font-slab);font-weight:600;font-size:17px;margin:0 0 10px;color:var(--chalk);display:flex;align-items:center;gap:9px}
.help-sec h3 .ic{width:26px;height:26px;border-radius:7px;background:#00000045;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto}
.help-sec.key h3 .ic{background:var(--amber);color:#241b0d}
.help-sec p,.help-sec li{font-size:14px;line-height:1.8;color:#d8d3c8;max-width:65ch}
.help-sec p{margin:0 0 8px}
.help-sec ol,.help-sec ul{margin:4px 0 8px;padding-left:1.4em}
.help-sec li{margin:3px 0}
.help-sec b{color:var(--chalk);font-weight:600}
.help-sec .k{display:inline-block;font-family:var(--font-mono);font-size:12px;padding:0 7px;border-radius:5px;background:#00000055;border:1px solid #ffffff24;color:var(--chalk);white-space:nowrap}
.help-tip{background:#141311;border-left:3px solid var(--green-lt);border-radius:6px;padding:10px 13px;margin-top:10px;font-size:13px;line-height:1.7;color:var(--chalk-dim)}
.help-tip.warn{border-left-color:var(--amber)}
.help-tip b{color:var(--chalk)}
.help-foot{padding:14px 22px 20px;border-top:1px solid #000;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.help-foot button{padding:10px 18px;border-radius:8px;font-size:13.5px;border:1px solid #00000040}
.help-foot .ok{background:var(--amber);color:#2a2113;border-color:var(--amber-dk);font-weight:600}
.help-foot .ok:hover,.help-foot .ok:focus-visible{background:var(--amber-dk);outline:none}
@media (max-width:640px){
  .help-head,.help-body,.help-foot{padding-left:16px;padding-right:16px}
  #btnHelp .lbl,#btnImport .lbl,#btnExport .lbl{display:none}
  .brand .bname{display:none}
}

.hide{display:none !important}
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">
    <svg class="clap" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="1.8" stroke-linejoin="round">
      <path d="M3 9h18v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>

    </button>
    <button class="tool" data-add="link" title="リンクカードを追加">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9 15l6-6M10 6l1-1a4 4 0 0 1 6 6l-1 1M14 18l-1 1a4 4 0 0 1-6-6l1-1"/></svg>

<script>
"use strict";
/* =========================================================================
   KOHboard — 単一ファイル / オフライン / IndexedDB
   ========================================================================= */

/* ---------- ユーティリティ ---------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const uid = p => p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const el = (tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};
const esc = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let toastT;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ---------- ストレージ層（IndexedDB→localStorageフォールバック）---------- */
const Store = (()=>{
  const DB="kohboard", STORE="state", KEY="app";
  let db=null, mode="idb";
  function open(){
    return new Promise(res=>{
      let req;
      try{ req=indexedDB.open(DB,1); }catch(e){ mode="ls"; return res(); }
      req.onupgradeneeded=e=>{ e.target.result.createObjectStore(STORE); };
      req.onsuccess=e=>{ db=e.target.result; res(); };
      req.onerror=()=>{ mode="ls"; res(); };
      // 一部ブラウザの file:// でハングする場合の保険
      setTimeout(()=>{ if(!db && mode==="idb"){ mode="ls"; res(); } },1500);
    });
  }
  function load(){
    return new Promise(res=>{
      if(mode==="ls"){ try{res(JSON.parse(localStorage.getItem("kohboard")||"null"));}catch(e){res(null);} return; }
      try{
        const tx=db.transaction(STORE,"readonly").objectStore(STORE).get(KEY);
        tx.onsuccess=()=>res(tx.result||null);
        tx.onerror=()=>res(null);
      }catch(e){res(null);}
    });
  }
  function save(data){
    if(mode==="ls"){ try{localStorage.setItem("kohboard",JSON.stringify(data));}catch(e){toast("保存容量オーバー：画像を減らすかエクスポートしてください");} return; }
    try{ db.transaction(STORE,"readwrite").objectStore(STORE).put(data,KEY); }catch(e){}
  }
  return {open,load,save,get mode(){return mode;}};
})();

/* ---------- アプリ状態 ---------- */
let state = { version:1, projects:[], ui:{ projectId:null, boardId:null } };
let activeColId = null;
let saveT;
function persist(){ clearTimeout(saveT); saveT=setTimeout(()=>Store.save(state),180); }

const curProject = ()=> state.projects.find(p=>p.id===state.ui.projectId)||null;
const curBoard   = ()=>{ const p=curProject(); return p ? (p.boards.find(b=>b.id===state.ui.boardId)||null) : null; };

/* ---------- 初期化 ---------- */
(async function init(){
  await Store.open();
  const saved = await Store.load();
  if(saved && saved.projects){ state=saved; if(!state.ui)state.ui={projectId:null,boardId:null}; }
  else { state = seed(); Store.save(state); }
  render();
  Help.firstRun();
})();

/* =========================================================================
   テンプレート
   参考: Yota Naruse「Vlogの作り方 -シネマティックVlog-」の
   Milanote SHOT LIST 手法（シーン別に、参考画像＋メモ＋撮り忘れ防止
   チェックリストを積む）と、撮影→構成→編集の流れを反映。
   ========================================================================= */
// ヘルパー：カード生成
const N  = t => ({id:uid("card"),type:"note",text:t});
const CK = (title,items)=>({id:uid("card"),type:"checklist",title,items:items.map(t=>({id:uid("i"),text:t,done:false}))});
const IMG= cap => ({id:uid("card"),type:"image",src:"",caption:cap});
const LK = (title,url,desc)=>({id:uid("card"),type:"link",url:url||"",title,description:desc||"",thumbnail:""});
const COL= (title,cards)=>({id:uid("col"),title,cards});
const BRD= (title,columns)=>({id:uid("board"),title,columns});

/* 1シーン分の定型（参考画像＋撮るショット＋カメラ/構図メモ） */
function scene(name,shots,memo){
  return COL(name,[
    IMG("参考カット（イメージ）"),
    CK("このシーンで撮るショット", shots),
    N("🎥 カメラ/構図：\n"+(memo||"")),
  ]);
}

/* --- ボードテンプレート --- */
const BOARD_TEMPLATES = {
  blank:{ label:"空のボード", desc:"カラムから自由に作る", build:t=>BRD(t||"新しいボード",[COL("Scene 1",[])]) },

  shotlist:{ label:"SHOT LIST（シーン別）", desc:"シーンごとに参考画像＋ショット＋メモ", build:t=>BRD(t||"SHOT LIST",[
    scene("出発", ["家を出る（引き）","玄関ドアを閉める手元","車に荷物を積む","走り出す車（追い）"], "朝の光。ワクワク感。POVと引きを混ぜる。"),
    scene("移動・車内", ["流れる車窓","運転の手元/横顔","カーステの操作","標識・地名サイン"], "手ブレOKの生活感。窓の反射に注意。"),
    scene("到着", ["建物の外観（引き）","看板・入口","荷物を降ろす","はじめての景色に反応"], "到着の高揚。広角で場所を見せる。"),
  ]) },

  gear:{ label:"GEAR LIST（機材リスト）", desc:"当日の持ち物チェック", build:t=>BRD(t||"GEAR LIST",[
    COL("カメラ本体",[CK("カメラ",["メインカメラ","セカンドカメラ","POVカメラ","ドローン"]), N("バッテリーは各◯本。フル充電済みか確認。")]),
    COL("レンズ",[CK("レンズ",["メインレンズ（標準）","スナップ用（単焦点）","広角"])]),
    COL("安定化・マウント",[CK("スタビライズ",["ジンバル","三脚 / ミニ三脚","スマホグリップ","吸盤マウント（車載）"])]),
    COL("フィルター・音声",[CK("フィルター",["NDフィルター","ブラックミスト","アダプターリング"]), CK("音声",["ワイヤレスマイク","風防（モフモフ）","予備電池"])]),
    COL("収録・データ",[CK("メディア",["SDカード（予備含む）","外付けHDD","カードリーダー","モバイルバッテリー","拭きクロス"])]),
  ]) },

  story:{ label:"STORY・構成", desc:"物語の流れを組み立てる", build:t=>BRD(t||"STORY・構成",[
    COL("オープニング",[N("掴みの15秒。一番の画 or 引き。"),CK("要素",["テーマを示すカット","タイトルテロップ","期待感のBGM"])]),
    COL("中盤（展開）",[N("体験を時系列＋テンポで。寄り引きのリズム。"),CK("要素",["メインアクティビティ","何気ない日常カット","人物の表情"])]),
    COL("クライマックス",[N("感情のピーク。音を活かす。"),CK("要素",["一番の絶景/瞬間","スローモーション","無音→BGMの緩急"])]),
    COL("エンディング",[N("余韻。締めの一言 or 明日への引き。"),CK("要素",["夕景/帰路","エンドロール","次回予告"])]),
  ]) },

  edit:{ label:"編集の組み立て方", desc:"撮影後の編集メモ", build:t=>BRD(t||"編集メモ",[
    COL("素材整理",[CK("下準備",["データバックアップ","OK/NGの選別","シーン順に並べる"])]),
    COL("選曲・BGM",[N("BGM先行でリズムを決める。"),LK("Artlist / Epidemic 等","","著作権フリー音源")]),
    COL("カット・繋ぎ",[CK("編集",["音ハメでカット","Jカット/Lカット","トランジションは最小限"])]),
    COL("仕上げ",[CK("仕上げ",["テロップ（地名・日付）","カラーグレーディング","書き出し設定 確認"])]),
  ]) },

  location:{ label:"LOCATION（ロケ地）", desc:"候補地・アクセス・許可", build:t=>BRD(t||"LOCATION",[
    COL("候補地",[IMG("ロケ地イメージ"),LK("参考リンク","","場所の情報")]),
    COL("アクセス・時間",[N("最寄り/駐車場/所要時間"),CK("確認",["営業時間","駐車場の有無","天気・日の出/日の入"])]),
    COL("撮影許可・注意",[CK("チェック",["撮影可否","三脚/ドローンの可否","混雑する時間帯"])]),
  ]) },

  schedule:{ label:"TIME SCHEDULE", desc:"当日のタイムスケジュール", build:t=>BRD(t||"TIME SCHEDULE",[
    COL("1日目",[CK("タイムライン",["07:00 出発","10:00 到着・ロケ①","12:00 昼食カット","15:00 ロケ②","18:00 マジックアワー","20:00 夕食・焚き火"])]),
    COL("2日目",[CK("タイムライン",["05:30 朝の風景","08:00 朝食","10:00 撤収カット","12:00 帰路"])]),
  ]) },
};

/* --- プロジェクトテンプレート --- */
const PROJECT_TEMPLATES = {
  blank:{ label:"空のプロジェクト", desc:"ボードを自分で追加", tag:"BLANK",
    build:t=>({id:uid("proj"),title:t,boards:[]}) },

  travel:{ label:"旅・キャンプVlog（なるせ式フルセット）", desc:"SHOT LIST(8シーン)＋GEAR＋STORY＋編集", tag:"FULL",
    build:t=>({id:uid("proj"),title:t,boards:[
      BRD("SHOT LIST",[
        scene("出発", ["家を出る（引き）","荷物を積む手元","走り出す車","高速の車窓"], "朝の光。旅の始まりのワクワク。"),
        scene("車内", ["運転の横顔","流れる景色","カーステ操作","会話・笑い"], "生活感。手持ちでOK。"),
        scene("到着", ["外観（引き）","看板・入口","第一声のリアクション","景色のパン"], "広角で場所を提示。"),
        scene("休憩", ["ドリンクを買う","景色を眺める","ベンチでひと息","足元・靴"], "何気ない間のカット。"),
        scene("サウナ", ["施設の外観","ととのいスペース","水風呂の水面","空を見上げる"], "湯気・水しぶきのインサート。※内部は撮影可否を確認。"),
        scene("夕食", ["料理の全景","湯気・寄り","乾杯","食べる表情"], "寄りのインサート多め。暖色の光。"),
        scene("焚き火", ["火をおこす手元","炎の寄り","火を囲む人","星空/夜景"], "スロー推奨。音（パチパチ）も収録。"),
        scene("朝", ["朝もや/日の出","寝袋から起きる","コーヒーを淹れる","撤収の様子"], "静かなトーン。マジックアワー。"),
      ]),
      BOARD_TEMPLATES.gear.build(),
      BOARD_TEMPLATES.story.build(),
      BOARD_TEMPLATES.edit.build(),
    ]}) },

  daily:{ label:"iPhone 日常Vlog（シンプル）", desc:"1ボードで手早く", tag:"SIMPLE",
    build:t=>({id:uid("proj"),title:t,boards:[
      BRD("Shot List",[

/* ---------- テンプレート選択オーバーレイ ---------- */
function openTemplatePicker(opts){
  // opts: {title, sub, nameLabel, nameDefault, templates, defaultKey, onPick(key,name)}
  const ov=$("#overlay"), panel=$("#ovPanel");
  let selKey=opts.defaultKey;
  const keys=Object.keys(opts.templates);
  panel.innerHTML=`<h2>${esc(opts.title)}</h2><div class="ov-sub">${esc(opts.sub)}</div>
    <div class="ov-field"><input id="ovName" type="text" placeholder="${esc(opts.nameLabel)}" value="${esc(opts.nameDefault||"")}"></div>
    <div class="tpl-grid">${keys.map(k=>{const t=opts.templates[k];
      return `<div class="tpl${k===selKey?" sel":""}" data-k="${k}">${t.tag?`<span class="tpl-tag">${t.tag}</span>`:""}<h4>${esc(t.label)}</h4><p>${esc(t.desc)}</p></div>`;}).join("")}</div>
    <div class="ov-actions"><button class="ov-cancel">キャンセル</button><button class="ov-ok">作成</button></div>`;
  ov.classList.add("show");
  const nameInp=$("#ovName"); nameInp.focus(); nameInp.select();
  panel.querySelectorAll(".tpl").forEach(t=>t.onclick=()=>{ selKey=t.dataset.k; panel.querySelectorAll(".tpl").forEach(x=>x.classList.toggle("sel",x===t)); });
  const close=()=>ov.classList.remove("show");
  panel.querySelector(".ov-cancel").onclick=close;
  ov.onclick=e=>{ if(e.target===ov) close(); };
  const go=()=>{ const name=nameInp.value.trim(); if(!name){ nameInp.focus(); return; } close(); opts.onPick(selKey,name); };
  panel.querySelector(".ov-ok").onclick=go;
  nameInp.onkeydown=e=>{ if(e.key==="Enter") go(); if(e.key==="Escape") close(); };
}

/* ---------- Board：カラム＋カード ---------- */
let labelFilter=null;  // 'todo' | 'done' | 'retake' | null

function renderBoard(){
  const b=curBoard(); if(!b){state.ui.boardId=null;return render();}
  const board=$("#board"); board.innerHTML="";
  if(!b.columns.some(c=>c.id===activeColId)) activeColId=b.columns[0]?b.columns[0].id:null;

  b.columns.forEach((col,idx)=>board.appendChild(renderColumn(col,idx)));

  const addCol=el("button","add-col-inline","＋ カラムを追加");
  addCol.onclick=()=>addColumn();
  board.appendChild(addCol);

  renderSummary();
  applyFilter();
}

/* 現在ボードの集計（ショット＝チェックリスト項目、ラベル＝カード） */
function boardStats(b){
  let shotTotal=0, shotDone=0, todo=0, done=0, retake=0;
  b.columns.forEach(c=>c.cards.forEach(card=>{
    if(card.type==="checklist"){ (card.items||[]).forEach(i=>{ shotTotal++; if(i.done)shotDone++; }); }
    if(card.label==="todo")todo++; else if(card.label==="done")done++; else if(card.label==="retake")retake++;
  }));
  return {shotTotal,shotDone,remain:shotTotal-shotDone,todo,done,retake};
}

function renderSummary(){
  const b=curBoard(); if(!b)return;
  const s=boardStats(b);
  const pct=s.shotTotal? Math.round(s.shotDone/s.shotTotal*100):0;
  const full=s.shotTotal>0 && s.remain===0;
  const bar=$("#summary");
  bar.innerHTML=`
    <span class="sm-title">${full?'✔':'<span class="rec"></span>'} 今日のショット</span>
    <span class="sm-main">${s.shotTotal? `残り <b>${s.remain}</b> / ${s.shotTotal}　<span class="done-n">撮影済 ${s.shotDone}（${pct}%）</span>` : 'チェックリストなし'}</span>
    <div class="sm-bar${full?' full':''}"><i style="width:${pct}%"></i></div>
    <div class="sm-chips">
      <button class="sm-chip todo${labelFilter==='todo'?' on':''}" data-f="todo"><span class="dot"></span>未撮影 ${s.todo}</button>
      <button class="sm-chip done${labelFilter==='done'?' on':''}" data-f="done"><span class="dot"></span>撮影済 ${s.done}</button>
      <button class="sm-chip retake${labelFilter==='retake'?' on':''}" data-f="retake"><span class="dot"></span>要再撮 ${s.retake}</button>
      ${labelFilter?'<button class="sm-clear">✕ 絞込解除</button>':''}
    </div>`;
  bar.querySelectorAll(".sm-chip").forEach(ch=>ch.onclick=()=>{ labelFilter = labelFilter===ch.dataset.f?null:ch.dataset.f; renderSummary(); applyFilter(); });
  const clr=bar.querySelector(".sm-clear"); if(clr)clr.onclick=()=>{ labelFilter=null; renderSummary(); applyFilter(); };
}

/* ラベル絞り込み：該当カードだけ強調 */
function applyFilter(){
  const board=$("#board");
  board.classList.toggle("filtering", !!labelFilter);
  $$(".card",board).forEach(c=>{
    const b=curBoard(); const card=findCardEl(c);
    c.classList.toggle("match", labelFilter && card && card.label===labelFilter);
  });
}
function findCardEl(cEl){
  const b=curBoard(); const colId=cEl.dataset.col, id=cEl.dataset.id;
  const col=b.columns.find(x=>x.id===colId); return col?col.cards.find(x=>x.id===id):null;
}

function renderColumn(col,idx){
  const c=el("div","column"+(col.id===activeColId?" active":"")); c.dataset.id=col.id;
  c.onclick=()=>{ if(activeColId!==col.id){ activeColId=col.id; $$(".column").forEach(x=>x.classList.toggle("active",x.dataset.id===col.id)); } };

  const head=el("div","col-head");
  const grip=el("span","col-grip","⣿"); grip.dataset.drag="col"; head.appendChild(grip);
  head.appendChild(el("span","col-scene","SC"+String(idx+1).padStart(2,"0")));
  const title=el("div","col-title"); title.contentEditable="true"; title.textContent=col.title;
  title.onblur=()=>{ col.title=title.textContent.trim(); persist(); };
  title.onkeydown=(e)=>{ if(e.key==="Enter"){e.preventDefault();title.blur();} };
  head.appendChild(title);
  head.appendChild(el("span","col-count",col.cards.length));
  const del=el("button","col-del","×"); del.title="カラムを削除";
  del.onclick=(e)=>{e.stopPropagation(); if(col.cards.length===0||confirm(`カラム「${col.title||"無題"}」を削除しますか？`)){ const b=curBoard(); b.columns=b.columns.filter(x=>x.id!==col.id); persist(); renderBoard(); }};
  head.appendChild(del);
  c.appendChild(head);

  const list=el("div","col-cards"); list.dataset.colId=col.id;
  if(col.cards.length===0){ list.appendChild(el("div","col-empty","カードなし")); }
  else col.cards.forEach(card=>list.appendChild(renderCard(card,col.id)));
  c.appendChild(list);

  const add=el("button","col-add","＋ カード");
  add.onclick=(e)=>{ e.stopPropagation(); activeColId=col.id; popAddCard(add,col.id); };
  c.appendChild(add);
  return c;
}

/* ---------- カード各種 ---------- */
function renderCard(card,colId){
  const c=el("div","card card-"+card.type+(card.label?" lab-"+card.label:"")); c.dataset.id=card.id; c.dataset.col=colId;
  const grip=el("div","card-grip","⠿"); grip.dataset.drag="card"; grip.title="ドラッグで移動"; c.appendChild(grip);
  const lab=el("button","card-lab"); lab.title="撮影ステータス";
  lab.onclick=(e)=>{ e.stopPropagation(); popLabelPicker(e.currentTarget,card,colId); };
  c.appendChild(lab);
  const del=el("button","card-del","×"); del.title="削除";
  del.onclick=()=>{ if(confirm("このカードを削除しますか？")){ removeCard(colId,card.id); } };
  c.appendChild(del);

  const tags={note:"NOTE",checklist:"CHECK",image:"IMAGE",link:"LINK"};
  c.appendChild(el("span","card-tag",tags[card.type]||""));

  if(card.type==="note")      buildNote(c,card);
  else if(card.type==="checklist") buildChecklist(c,card,colId);
  else if(card.type==="image") buildImage(c,card);
  else if(card.type==="link")  buildLink(c,card);
  return c;
}

function buildNote(c,card){
  const body=el("div","editable ph note-body"); body.contentEditable="true"; body.dataset.ph="メモを入力…";
  body.textContent=card.text||"";
  body.oninput=()=>{ card.text=body.innerText; persist(); };
  c.appendChild(body);
}

function buildChecklist(c,card,colId){
  const head=el("div","chk-head");
  const title=el("div","editable ph chk-title"); title.contentEditable="true"; title.dataset.ph="リスト名"; title.textContent=card.title||"";
  title.oninput=()=>{ card.title=title.innerText; persist(); };
  head.appendChild(title);
  const done=(card.items||[]).filter(i=>i.done).length, tot=(card.items||[]).length;
  const prog=el("span","chk-progress"+(tot>0&&done===tot?" full":""),`${done}/${tot}`);
  head.appendChild(prog); c.appendChild(head);

  const bar=el("div","chk-bar"); const fill=el("i"); fill.style.width=(tot?done/tot*100:0)+"%"; bar.appendChild(fill); c.appendChild(bar);

  (card.items||[]).forEach(item=>{
    const row=el("div","chk-item"+(item.done?" done":""));
    const box=el("div","chk-box");
    box.onclick=()=>{ item.done=!item.done; persist(); refreshCard(colId,card.id); };
    row.appendChild(box);
    const txt=el("div","editable chk-text"); txt.contentEditable="true"; txt.textContent=item.text||"";
    txt.oninput=()=>{ item.text=txt.innerText; persist(); };
    txt.onkeydown=(e)=>{ if(e.key==="Enter"){e.preventDefault(); addChkItem(card,colId);} };
    row.appendChild(txt);
    const d=el("button","chk-del","×"); d.onclick=()=>{ card.items=card.items.filter(i=>i.id!==item.id); persist(); refreshCard(colId,card.id); };
    row.appendChild(d);
    c.appendChild(row);
  });
  const add=el("button","chk-add","＋ 項目を追加");
  add.onclick=()=>addChkItem(card,colId);
  c.appendChild(add);
}
function addChkItem(card,colId){ card.items=card.items||[]; card.items.push({id:uid("i"),text:"",done:false}); persist(); refreshCard(colId,card.id);
  setTimeout(()=>{ const cc=$(`.card[data-id="${card.id}"]`); if(cc){ const rows=cc.querySelectorAll(".chk-text"); rows[rows.length-1]&&rows[rows.length-1].focus(); } },0); }

function buildImage(c,card){
  const wrap=el("div","img-wrap");
  if(card.src){
    const img=el("img"); img.src=card.src; img.alt=card.caption||""; wrap.appendChild(img);
  }else{
    const empty=el("div","img-empty");
    empty.innerHTML='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="1.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg><span>クリックで画像を選択<br>（Ctrl+V 貼付も可）</span>';
    empty.onclick=()=>pickImageInto(card);
    wrap.appendChild(empty);
  }
  c.appendChild(wrap);
  const cap=el("div","editable ph cap"); cap.contentEditable="true"; cap.dataset.ph="キャプション…"; cap.textContent=card.caption||"";
  cap.oninput=()=>{ card.caption=cap.innerText; persist(); };
  c.appendChild(cap);
}

function buildLink(c,card){
  const has=card.url||card.title;
  if(card.thumbnail){ const t=el("img","link-thumb"); t.src=card.thumbnail; c.appendChild(t); }
  const a=el("a","link-title"); a.textContent=card.title||card.url||"（未設定のリンク）";
  a.href=card.url||"#"; a.target="_blank"; a.rel="noopener noreferrer";
  if(!card.url) a.onclick=e=>e.preventDefault();
  c.appendChild(a);
  if(card.url){ c.appendChild(el("div","link-url",card.url)); }
  if(card.description){ c.appendChild(el("div","link-desc",card.description)); }

  const row=el("div","link-editrow");
  const edit=el("button","mini-btn",has?"✎ 編集":"＋ 情報を入力");
  edit.onclick=()=>openLinkEditor(c,card);
  row.appendChild(edit); c.appendChild(row);
}
function openLinkEditor(c,card){
  const box=el("div","link-fields");
  const f=(ph,val,key,type="text")=>{ const i=el("input"); i.placeholder=ph; i.value=val||""; i.oninput=()=>{card[key]=i.value.trim();}; box.appendChild(i); return i; };
  f("URL（https://…）",card.url,"url");
  f("タイトル",card.title,"title");
  f("説明",card.description,"description");
  f("サムネイル画像URL（任意）",card.thumbnail,"thumbnail");
  const save=el("button","mini-btn","保存"); save.style.marginTop="4px";
  save.onclick=()=>{ persist(); refreshCard(card.__col||c.dataset.col, card.id); };
  box.appendChild(save);
  // 差し替え
  const old=c.querySelector(".link-editrow"); c.querySelectorAll(".link-title,.link-url,.link-desc,.link-thumb,.link-editrow").forEach(x=>x.remove());
  c.appendChild(box);
  box.querySelector("input").focus();
}

/* 単一カードだけ再描画（フォーカス崩れ防止） */
function refreshCard(colId,cardId){
  const col=curBoard().columns.find(c=>c.id===colId); if(!col)return;
  const card=col.cards.find(x=>x.id===cardId); if(!card){ renderBoard(); return; }
  const oldEl=$(`.card[data-id="${cardId}"]`); if(!oldEl){ renderBoard(); return; }
  card.__col=colId;
  oldEl.replaceWith(renderCard(card,colId));
  renderSummary(); applyFilter();
}

/* =========================================================================
   カード / カラム 追加・削除
   ========================================================================= */
function addCardTo(colId,type){
  const col=curBoard().columns.find(c=>c.id===colId);
  if(!col){ toast("先にカラムを追加してください"); return; }
  let card={id:uid("card"),type};
  if(type==="note") card.text="";
  else if(type==="checklist"){ card.title=""; card.items=[{id:uid("i"),text:"",done:false}]; }
  else if(type==="image"){ card.src=""; card.caption=""; }
  else if(type==="link"){ card.url="";card.title="";card.description="";card.thumbnail=""; }
  col.cards.push(card); persist(); renderBoard();
  setTimeout(()=>{ const e=$(`.card[data-id="${card.id}"]`); if(e){ e.scrollIntoView({block:"nearest"}); const ed=e.querySelector('[contenteditable="true"]'); if(type==="image")e.querySelector(".img-empty")&&null; else if(type==="link")e.querySelector(".mini-btn").click(); else ed&&ed.focus(); } },0);
}
function removeCard(colId,cardId){
  const col=curBoard().columns.find(c=>c.id===colId); if(!col)return;
  col.cards=col.cards.filter(c=>c.id!==cardId); persist(); renderBoard();
}
function addColumn(){
  const b=curBoard(); const col={id:uid("col"),title:"",cards:[]};
  b.columns.push(col); activeColId=col.id; persist(); renderBoard();
  setTimeout(()=>{ const e=$(`.column[data-id="${col.id}"] .col-title`); if(e){e.focus();} const bd=$("#board"); bd.scrollLeft=bd.scrollWidth; },0);
}

/* 画像取り込み（リサイズしてBase64） */
function pickImageInto(card){
  const inp=$("#filePick");
  inp.onchange=()=>{ const f=inp.files[0]; if(f) readImage(f,dataUrl=>{ card.src=dataUrl; persist(); refreshCard(card.__col||activeColId,card.id); renderBoard(); }); inp.value=""; };
  inp.click();
}
/* 複数画像を一括で画像カードとして追加（順序を保持） */
function pickImagesInto(colId){
  if(!colId){ toast("追加先のカラムをタップして選んでください"); return; }
  const inp=$("#filePick");
  inp.onchange=()=>{
    const files=[...inp.files]; inp.value="";
    if(!files.length)return;
    const col=curBoard().columns.find(c=>c.id===colId); if(!col)return;
    if(files.length===1){ readImage(files[0],d=>{ col.cards.push({id:uid("card"),type:"image",src:d,caption:""}); persist(); renderBoard(); toast("画像を追加しました"); }); return; }
    toast(files.length+"枚を読み込み中…");
    const slots=new Array(files.length).fill(null); let pending=files.length, ok=0;
    files.forEach((f,i)=>readImage(f,d=>{
      slots[i]={id:uid("card"),type:"image",src:d,caption:""}; ok++;
      if(--pending===0){ slots.forEach(s=>s&&col.cards.push(s)); persist(); renderBoard(); toast(ok+"枚の画像を追加しました"); }
    }));
  };
  inp.click();
}
function readImage(file,cb){
  const r=new FileReader();
  r.onload=()=>{ const img=new Image(); img.onload=()=>{
    const max=1600; let{width:w,height:h}=img;
    if(w>max||h>max){ const s=max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    cv.getContext("2d").drawImage(img,0,0,w,h);
    cb(cv.toDataURL("image/jpeg",0.85));
  }; img.src=r.result; };
  r.readAsDataURL(file);
}

/* =========================================================================
   ドラッグ&ドロップ（マウス/タッチ両対応・自前実装）
   ========================================================================= */
let dnd=null;
$("#board").addEventListener("pointerdown",e=>{
  const handle=e.target.closest('[data-drag]'); if(!handle)return;
  const kind=handle.dataset.drag; // 'card' | 'col'
  const item=kind==="card"?handle.closest(".card"):handle.closest(".column");
  if(!item)return;
  e.preventDefault();
  startDrag(e,item,kind);
});

function startDrag(e,item,kind){
  const rect=item.getBoundingClientRect();
  const clone=item.cloneNode(true);
  clone.classList.add("drag-clone");
  clone.style.width=rect.width+"px"; clone.style.height=(kind==="col"?Math.min(rect.height,innerHeight-100):rect.height)+"px";
  clone.style.left=rect.left+"px"; clone.style.top=rect.top+"px";
  document.body.appendChild(clone);

  const ph=el("div",kind==="card"?"card-ph":"col-ph");
  ph.style.height=rect.height+"px"; if(kind==="card")ph.style.width=rect.width+"px";
  item.style.display="none";
  item.parentNode.insertBefore(ph,item);

  dnd={kind,item,clone,ph,offX:e.clientX-rect.left,offY:e.clientY-rect.top,srcCol:kind==="card"?item.dataset.col:null};
  document.body.classList.add("dragging");
  window.addEventListener("pointermove",onDrag);
  window.addEventListener("pointerup",endDrag,{once:true});
}

function onDrag(e){
  if(!dnd)return;
  dnd.clone.style.left=(e.clientX-dnd.offX)+"px";
  dnd.clone.style.top=(e.clientY-dnd.offY)+"px";
  autoScroll(e);
  const under=document.elementFromPoint(e.clientX,e.clientY);
  if(!under)return;

  if(dnd.kind==="card"){
    const list=under.closest(".col-cards"); if(!list)return;
    const empty=list.querySelector(".col-empty"); if(empty)empty.remove();
    const after=afterElement(list,".card",e.clientY,"y");
    if(after) list.insertBefore(dnd.ph,after); else list.appendChild(dnd.ph);
  }else{
    const board=$("#board");
    const after=afterElement(board,".column",e.clientX,"x");
    if(after) board.insertBefore(dnd.ph,after); else board.insertBefore(dnd.ph,$(".add-col-inline"));
  }
}

function afterElement(container,sel,coord,axis){
  const els=$$(sel,container).filter(x=>x!==dnd.item && x.style.display!=="none");
  let best=null,bestDist=-Infinity;
  for(const c of els){
    const r=c.getBoundingClientRect();
    const mid=axis==="y"?(coord-(r.top+r.height/2)):(coord-(r.left+r.width/2));
    if(mid<0 && mid>bestDist){ bestDist=mid; best=c; }
  }
  return best;
}

function endDrag(){
  if(!dnd)return;
  const {kind,item,clone,ph}=dnd;
  clone.remove(); item.style.display="";
  document.body.classList.remove("dragging");
  window.removeEventListener("pointermove",onDrag);
  const b=curBoard();

  if(kind==="card"){
    const cardId=item.dataset.id, fromCol=dnd.srcCol;
    const targetList=ph.parentNode.closest(".col-cards");
    const toCol=targetList?targetList.dataset.colId:fromCol;
    // 挿入位置
    const siblings=$$(".card",targetList||ph.parentNode).filter(x=>x!==item);
    let index=0; let n=ph.previousElementSibling;
    while(n){ if(n.classList&&n.classList.contains("card")&&n!==item)index++; n=n.previousElementSibling; }
    ph.remove();
    // データ更新
    const src=b.columns.find(c=>c.id===fromCol);
    const ci=src.cards.findIndex(c=>c.id===cardId);
    const [moved]=src.cards.splice(ci,1);
    const dst=b.columns.find(c=>c.id===toCol);
    dst.cards.splice(index,0,moved);
    activeColId=toCol;
    persist(); renderBoard();
  }else{
    const colId=item.dataset.id;
    let index=0; let n=ph.previousElementSibling;
    while(n){ if(n.classList&&n.classList.contains("column")&&n!==item)index++; n=n.previousElementSibling; }
    ph.remove();
    const ci=b.columns.findIndex(c=>c.id===colId);
    const [moved]=b.columns.splice(ci,1);
    b.columns.splice(index,0,moved);
    persist(); renderBoard();
  }
  dnd=null;
}

function autoScroll(e){
  const board=$("#board"), edge=60, sp=18;
  const r=board.getBoundingClientRect();
  if(e.clientX>r.right-edge) board.scrollLeft+=sp;
  else if(e.clientX<r.left+edge) board.scrollLeft-=sp;
  // 縦（カラム内）
  const list=document.elementFromPoint(e.clientX,e.clientY);
  const cl=list&&list.closest&&list.closest(".col-cards");
  if(cl){ const lr=cl.getBoundingClientRect();
    if(e.clientY>lr.bottom-edge) cl.scrollTop+=sp;
    else if(e.clientY<lr.top+edge) cl.scrollTop-=sp;
  }
}

$("#btnExport").onclick=()=>{

                    : {kind:"kohboard-all",version:1,projects:state.projects};
  const name = (p?p.title:"KOH_Trip_Vlog_all").replace(/[\\/:*?"<>|]/g,"_");
  download(JSON.stringify(payload,null,2), name+".json");
  toast(p?"プロジェクトを書き出しました":"全プロジェクトを書き出しました");

async function download(text,filename){
  try{
    const f=new File([text],filename,{type:"application/json"});
    if(/iPhone|iPad|Android/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:filename}); return; }
  }catch(e){ if(e&&e.name==="AbortError") return; }
  const blob=new Blob([text],{type:"application/json"});
  const a=el("a"); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$("#btnImport").onclick=()=>{
  const inp=el("input"); inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ importData(JSON.parse(r.result)); }catch(err){ toast("読み込み失敗：JSON形式を確認してください"); } };
    r.readAsText(f); };
  inp.click();
};
function importData(d){
  const fix=p=>{ p.id=uid("proj"); p.boards=(p.boards||[]).map(b=>{b.id=uid("board");b.columns=(b.columns||[]).map(c=>{c.id=uid("col");c.cards=(c.cards||[]).map(cd=>{cd.id=uid("card");if(cd.items)cd.items=cd.items.map(i=>({...i,id:uid("i")}));return cd;});return c;});return b;}); return p; };
  let added=0;
  if(d.kind==="kohboard-project"&&d.project){ state.projects.push(fix(d.project)); added=1; }
  else if(d.kind==="kohboard-all"&&d.projects){ d.projects.forEach(p=>{state.projects.push(fix(p));}); added=d.projects.length; }
  else if(d.projects){ d.projects.forEach(p=>{state.projects.push(fix(p));}); added=d.projects.length; } // 旧仕様書形式
  else { toast("対応していないファイルです"); return; }
  persist(); state.ui.projectId=null; state.ui.boardId=null; render();
  toast(`${added} 件のプロジェクトを読み込みました`);
}

          <li><b>画面が古いまま</b>：一度閉じて、開き直す（新しい版は次に開いたときに反映されます）</li>
          <li><b>間違えて消した</b>：元に戻す機能はありません。こまめに書出しておくと安心</li>
          <li><b>画像が入らない</b>：写真が大きすぎる場合は、iPhoneの写真アプリでスクリーンショットを撮ってから入れる</li>
          <li><b>この説明をもう一度見る</b>：右上の <span class="k">？</span></li>
        </ul>`},
    ];
  }

  function build(){
    let el=document.getElementById("help");
    if(!el){ el=document.createElement("div"); el.id="help"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true"); el.setAttribute("aria-labelledby","helpTitle"); document.body.appendChild(el); }
    const secs=sections();
    el.innerHTML=`<div class="help-panel">
      <div class="help-head">
        <h2 id="helpTitle">KOH Trip Vlog Location Board の使い方</h2>
        <p>はじめての方は「新しい旅の予定を追加する」と「撮影当日の使い方」だけ読めば大丈夫です。</p>
        <button class="help-x" aria-label="閉じる">×</button>
        <div class="help-toc">${secs.map(s=>`<button data-go="${s.id}">${s.t}</button>`).join("")}</div>
      </div>
      <div class="help-body">${secs.map(s=>`<section class="help-sec${s.key?" key":""}" id="help-${s.id}"><h3><span class="ic">${s.ic}</span>${s.t}</h3>${s.html}</section>`).join("")}</div>
      <div class="help-foot"><button class="ok">はじめる</button></div>
    </div>`;
    el.querySelector(".help-x").onclick=close;
    el.querySelector(".ok").onclick=close;
    el.onclick=e=>{ if(e.target===el) close(); };
    el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ const t=document.getElementById("help-"+b.dataset.go); if(t) t.scrollIntoView({behavior:"smooth",block:"start"}); });
    return el;
  }
  function open(sectionId){
    const el=build(); el.classList.add("show"); el.scrollTop=0;
    if(sectionId){ const t=document.getElementById("help-"+sectionId); if(t) setTimeout(()=>t.scrollIntoView({block:"start"}),30); }
    setTimeout(()=>{ const x=el.querySelector(".help-x"); if(x) x.focus(); },40);
  }
  function close(){
    const el=document.getElementById("help"); if(el) el.classList.remove("show");
    try{ localStorage.setItem(SEEN_KEY,"1"); }catch(e){}
  }
  function firstRun(){
    let seen=false; try{ seen=!!localStorage.getItem(SEEN_KEY); }catch(e){ seen=true; }
    if(!seen) open();
  }
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ const el=document.getElementById("help"); if(el&&el.classList.contains("show")) close(); } });
  return {open,close,firstRun};
})();
(()=>{ const b=document.getElementById("btnHelp"); if(b) b.onclick=()=>Help.open(); })();

/* オフライン対応（http/https で開いたときだけ） */
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
